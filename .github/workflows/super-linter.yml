# GitHub Super Linter Workflow
# Runs ESLint and Prettier on all TypeScript/JavaScript files
name: Lint Code Base

on:
  pull_request:
    branches-ignore:
      - main
      - staging
      - master

jobs:
  run-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Get changed JS/JSX/TS/TSX files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.js
            **/*.jsx
            **/*.ts
            **/*.tsx
      
      - name: Run ESLint on changed files only
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          npx eslint --cache --cache-location .eslintcache \
            ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Run Prettier on changed files only
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          npx prettier --check \
            ${{ steps.changed-files.outputs.all_changed_files }}
      
      - name: Super Linter
        uses: super-linter/super-linter@v8
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JAVASCRIPT_PRETTIER: true
          LINTER_RULES_PATH: /
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          ESLINT_USE_FLAT_CONFIG: true
          JAVASCRIPT_PRETTIER_CONFIG_FILE: .prettierrc
